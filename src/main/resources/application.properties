spring.data.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/corona-tracker}
# Kafka
spring.kafka.bootstrap-servers=kafka-external.messaging.svc.cluster.local:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Redis
spring.redis.host=redis.messaging.svc.cluster.local
spring.redis.port=6379
